- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
    state: present

- name: Add Docker GPG apt Key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker Repository
  apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker and Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Ensure docker service is running and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Create app directory on remote
  file:
    path: /opt/app
    state: directory
    mode: '0755'

- name: Copy app files to remote
  copy:
    src: "{{ item }}"
    dest: "/opt/app/"
  loop:
    - "../../../app/Dockerfile.flask"
    - "../../../app/nginx.conf"
    - "../../../app/src"

- name: Create docker-compose.yml on remote
  copy:
    content: |
      services:
        flask_app:
          build:
            context: .
            dockerfile: Dockerfile.flask
          ports:
            - "5000:5000"
          restart: always

        nginx:
          image: nginx:alpine
          ports:
            - "80:80"
          volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
          depends_on:
            - flask_app
          restart: always
    dest: /opt/app/docker-compose.yml

- name: Deploy application using Docker Compose plugin
  command: docker compose up -d --build
  args:
    chdir: /opt/app    
